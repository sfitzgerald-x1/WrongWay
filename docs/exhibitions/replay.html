<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Normal-duel exhibition replay</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #e8ecf3;
    --muted: #93a0b4;
    --panel: #161b24;
    --line: #2a3341;
    --cell: #202836;
    --goal-a: #3d6fd6;
    --goal-b: #c2603a;
    --wall: #d8c07a;
    --accent: #7fd18c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: #0d1117;
    color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .layout { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  .side { min-width: 320px; max-width: 460px; display: flex; flex-direction: column; gap: 16px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  button {
    font: inherit;
    color: var(--ink);
    background: #232b37;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #2c3543; }
  button:disabled { opacity: .45; cursor: default; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  input[type=range] { flex: 1 1 180px; min-width: 140px; accent-color: var(--accent); }
  .status { color: var(--muted); margin-top: 6px; }
  .tag {
    display: inline-block;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .error { color: #ff8f8f; white-space: pre-wrap; }
  .a { color: var(--goal-a); }
  .b { color: var(--goal-b); }
</style>
</head>
<body>
<h1>Normal-duel exhibition replay</h1>
<p class="status" id="subtitle">Loading artifact…</p>
<p class="error" id="error" hidden></p>

<div class="layout">
  <div class="panel">
    <svg id="board" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Board"></svg>
    <div class="controls">
      <button id="first" title="First ply">&#124;&lt;</button>
      <button id="back" title="Back one ply (←)">&lt;</button>
      <button id="play" title="Play / pause (space)">Play</button>
      <button id="step" title="Step one ply (→)">&gt;</button>
      <button id="last" title="Last ply">&gt;&#124;</button>
      <input type="range" id="scrub" min="0" max="0" value="0" aria-label="Ply">
    </div>
    <p class="status" id="plyStatus"></p>
  </div>

  <div class="side">
    <div class="panel">
      <h2>Ply</h2>
      <dl id="plyDetail"></dl>
    </div>
    <div class="panel">
      <h2>Hard+ telemetry (side A)</h2>
      <dl id="telemetry"></dl>
    </div>
    <div class="panel">
      <h2>Exhibition</h2>
      <dl id="meta"></dl>
    </div>
  </div>
</div>

<script type="module">
const DEFAULT_ARTIFACT = './hardplus-exhibition-balanced-9x9-007.json';
const CELL = 48;
const GAP = 8;
const PLAY_INTERVAL_MS = 900;
const SVG_NS = 'http://www.w3.org/2000/svg';

const element = (id) => document.getElementById(id);
const board = element('board');
const errorOut = element('error');

function showError(message) {
  errorOut.hidden = false;
  errorOut.textContent = message;
}

function artifactUrl() {
  const requested = new URLSearchParams(location.search).get('artifact');
  const url = new URL(requested ?? DEFAULT_ARTIFACT, location.href);
  if (url.origin !== location.origin) throw new Error('artifact must be same-origin');
  return url;
}

function svg(name, attributes) {
  const node = document.createElementNS(SVG_NS, name);
  for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, String(value));
  return node;
}

function describeList(target, rows) {
  target.replaceChildren();
  for (const [label, value, className] of rows) {
    if (value === null || value === undefined || value === '') continue;
    const term = document.createElement('dt');
    term.textContent = label;
    const detail = document.createElement('dd');
    detail.textContent = String(value);
    if (className) detail.className = className;
    target.append(term, detail);
  }
}

function actionText(action) {
  if (!action) return '—';
  return action.kind === 'pawn'
    ? `pawn → r${action.to.r}c${action.to.c}`
    : `wall ${action.wall}`;
}

function round(value, digits = 1) {
  return typeof value === 'number' && Number.isFinite(value) ? value.toFixed(digits) : null;
}

/** `H-r-c` blocks the row r/r+1 boundary across columns c and c+1; `V-r-c` is its transpose. */
function wallSegment(text) {
  const match = /^([HV])-(\d+)-(\d+)$/.exec(text);
  if (!match) return null;
  const [, orientation, rawRow, rawColumn] = match;
  const r = Number(rawRow);
  const c = Number(rawColumn);
  const at = (index) => index * (CELL + GAP);
  return orientation === 'H'
    ? { x: at(c), y: at(r) + CELL + GAP / 2, width: 2 * CELL + GAP, height: 0 }
    : { x: at(c) + CELL + GAP / 2, y: at(r), width: 0, height: 2 * CELL + GAP };
}

function renderBoard(config, position, highlight) {
  const span = (count) => count * CELL + (count - 1) * GAP;
  const width = span(config.columns);
  const height = span(config.rows);
  const at = (index) => index * (CELL + GAP);
  board.setAttribute('viewBox', `-14 -14 ${width + 28} ${height + 28}`);
  board.replaceChildren();

  board.append(svg('rect', {
    x: -6, y: -6, width: width + 12, height: height + 12, rx: 6,
    fill: 'none', stroke: 'var(--line)'
  }));
  for (const [player, row] of Object.entries(config.goalRows)) {
    board.append(svg('rect', {
      x: -6,
      y: row === 0 ? -10 : height + 4,
      width: width + 12,
      height: 6,
      fill: player === 'A' ? 'var(--goal-a)' : 'var(--goal-b)',
      opacity: 0.75
    }));
  }
  for (let r = 0; r < config.rows; r += 1) {
    for (let c = 0; c < config.columns; c += 1) {
      board.append(svg('rect', {
        x: at(c), y: at(r), width: CELL, height: CELL, rx: 4, fill: 'var(--cell)'
      }));
    }
  }
  for (const text of position.walls) {
    const segment = wallSegment(text);
    if (!segment) continue;
    const isLast = highlight?.kind === 'wall' && highlight.wall === text;
    board.append(svg('line', {
      x1: segment.x,
      y1: segment.y,
      x2: segment.x + segment.width,
      y2: segment.y + segment.height,
      stroke: isLast ? 'var(--accent)' : 'var(--wall)',
      'stroke-width': GAP - 1,
      'stroke-linecap': 'round'
    }));
  }
  for (const player of ['A', 'B']) {
    const pawn = position.pawns[player];
    const cx = at(pawn.c) + CELL / 2;
    const cy = at(pawn.r) + CELL / 2;
    const isLast = highlight?.kind === 'pawn'
      && highlight.to.r === pawn.r && highlight.to.c === pawn.c;
    board.append(svg('circle', {
      cx, cy, r: CELL / 2 - 6,
      fill: player === 'A' ? 'var(--goal-a)' : 'var(--goal-b)',
      stroke: isLast ? 'var(--accent)' : 'transparent',
      'stroke-width': 3
    }));
    const label = svg('text', {
      x: cx, y: cy + 5, 'text-anchor': 'middle', fill: '#0d1117',
      'font-size': 16, 'font-weight': 700
    });
    label.textContent = player;
    board.append(label);
  }
}

function main(artifact) {
  const { config, plies } = artifact;
  const positions = [artifact.initialPosition, ...plies.map((ply) => ply.position)];
  const roles = artifact.exhibition.roles;
  const scrub = element('scrub');
  const requestedPly = Number(new URLSearchParams(location.search).get('ply') ?? 0);
  let index = Number.isFinite(requestedPly)
    ? Math.min(plies.length, Math.max(0, Math.trunc(requestedPly)))
    : 0;
  let timer = null;

  element('subtitle').textContent = `${artifact.exhibition.openingId} · `
    + `A ${artifact.exhibition.sides.A.engineId}@${artifact.exhibition.sides.A.version} vs `
    + `B ${artifact.exhibition.sides.B.engineId}@${artifact.exhibition.sides.B.version} · `
    + `${artifact.exhibition.perTurnDeadlineMs} ms per turn · `
    + `${artifact.exhibition.enforced ? 'enforced' : 'non-enforced'}`;

  describeList(element('meta'), [
    ['Format', artifact.format],
    ['Kind', artifact.exhibition.kind],
    ['Mode', artifact.exhibition.mode],
    ['Clock', artifact.exhibition.clockProfile?.id],
    ['Seed', artifact.exhibition.seed],
    ['Side A', `${roles.A} (${artifact.exhibition.sides.A.version})`, 'a'],
    ['Side B', `${roles.B} (${artifact.exhibition.sides.B.version})`, 'b'],
    ['Baseline commit', artifact.baseline.sourceCommit],
    ['Repository', `${artifact.repository.headCommit.slice(0, 12)}`
      + `${artifact.repository.worktreeDirty ? ' (dirty worktree)' : ''}`],
    ['Candidate artifact', artifact.candidate.artifactProvenance?.verification],
    ['Corpus', artifact.corpusProvenance?.verification],
    ['Result', `${artifact.outcome.resultKind}`
      + `${artifact.outcome.winner ? ` — ${artifact.outcome.winner} (${artifact.outcome.winnerRole})` : ''}`
      + `${artifact.outcome.reason ? ` by ${artifact.outcome.reason}` : ''}`],
    ['Final ply', artifact.outcome.finalPly]
  ]);

  function render() {
    const ply = index === 0 ? null : plies[index - 1];
    const position = positions[index];
    renderBoard(config, position, ply?.action);
    scrub.value = String(index);
    element('plyStatus').textContent = `Ply ${index} of ${plies.length}`
      + `${ply ? ` · ${ply.phase}` : ' · initial position'}`
      + ` · ${position.turn} to move · stock A ${position.stock.A} / B ${position.stock.B}`;

    describeList(element('plyDetail'), ply === null
      ? [['Position', 'initial'], ['To move', position.turn]]
      : [
        ['Ply', ply.ply],
        ['Phase', ply.phase],
        ['Actor', `${ply.actor} — ${roles[ply.actor]}`, ply.actor === 'A' ? 'a' : 'b'],
        ['Action', actionText(ply.action)],
        ['Action code', ply.actionCode],
        ['Outcome', ply.outcome?.kind === 'ongoing'
          ? 'ongoing'
          : `${ply.outcome?.kind}${ply.outcome?.winner ? ` ${ply.outcome.winner}` : ''}`
            + `${ply.outcome?.reason ? ` (${ply.outcome.reason})` : ''}`],
        ['To move', position.turn]
      ]);

    const telemetry = ply?.telemetry;
    describeList(element('telemetry'), telemetry
      ? [
        ['Side', `${ply.actor} — ${roles[ply.actor]}`],
        ['Nodes', telemetry.nodes],
        ['Depth', telemetry.depth],
        ['Charged active ms', round(telemetry.chargedActiveMs)],
        ['Charged select ms', round(telemetry.chargedSelectMs)],
        ['Charged setup ms', round(telemetry.chargedSetupMs)],
        ['Charged observer ms', round(telemetry.chargedObserverMs)],
        ['Self-reported ms', round(telemetry.reportedElapsedMs)],
        ['Timing source', telemetry.timingSource],
        ['Clock profile', telemetry.clockProfileId]
      ]
      : [['Telemetry', ply === null ? 'initial position' : 'none recorded (committed opening ply)']]);

    element('back').disabled = index === 0;
    element('first').disabled = index === 0;
    element('step').disabled = index === plies.length;
    element('last').disabled = index === plies.length;
  }

  function goto(next) {
    index = Math.min(plies.length, Math.max(0, next));
    if (index === plies.length) stop();
    render();
  }

  function stop() {
    if (timer !== null) clearInterval(timer);
    timer = null;
    element('play').textContent = 'Play';
  }

  function togglePlay() {
    if (timer !== null) {
      stop();
      return;
    }
    if (index === plies.length) index = 0;
    element('play').textContent = 'Pause';
    timer = setInterval(() => goto(index + 1), PLAY_INTERVAL_MS);
    goto(index + 1);
  }

  scrub.max = String(plies.length);
  scrub.addEventListener('input', () => {
    stop();
    goto(Number(scrub.value));
  });
  element('first').addEventListener('click', () => { stop(); goto(0); });
  element('back').addEventListener('click', () => { stop(); goto(index - 1); });
  element('step').addEventListener('click', () => { stop(); goto(index + 1); });
  element('last').addEventListener('click', () => { stop(); goto(plies.length); });
  element('play').addEventListener('click', togglePlay);
  document.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowLeft') { stop(); goto(index - 1); }
    else if (event.key === 'ArrowRight') { stop(); goto(index + 1); }
    else if (event.key === ' ') { event.preventDefault(); togglePlay(); }
    else return;
  });
  render();
}

try {
  const url = artifactUrl();
  const response = await fetch(url, { cache: 'no-store' });
  if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
  const artifact = await response.json();
  if (artifact.format !== 'normal-duel-hardplus-exhibition-replay-v1') {
    throw new Error(`unsupported artifact format ${artifact.format}`);
  }
  main(artifact);
} catch (cause) {
  element('subtitle').textContent = 'No replay loaded.';
  showError(`Could not load the replay artifact: ${cause.message}\n`
    + 'Serve the repository over http:// and pass ?artifact=<relative-url>, '
    + `or place the default artifact at ${DEFAULT_ARTIFACT}.`);
}
</script>
</body>
</html>
