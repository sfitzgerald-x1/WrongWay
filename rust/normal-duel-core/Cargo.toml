[package]
name = "wrongway-normal-duel"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native normal-duel-v1 rules core for WrongWay"
publish = false

[lib]
name = "wrongway_normal_duel"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# `performance.now()` is available as a monotonic clock in browser and Node
# JavaScript hosts.
# Keep this target-specific so native builds continue to use `std::time::Instant`.
wasm-bindgen = "=0.2.126"

[dev-dependencies]
serde_json = "1.0"

[lints]
workspace = true
